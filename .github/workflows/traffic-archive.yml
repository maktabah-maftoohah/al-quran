name: Archive GitHub Pages Traffic

on:
  schedule:
    # Run once daily at 00:15 UTC to capture preceding day traffic
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-archiver
  cancel-in-progress: false

jobs:
  archive-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Traffic Archiver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/archive_traffic.py

      - name: Commit and Push Lifetime Traffic Archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/traffic/
          if git diff --staged --quiet; then
            echo "No new traffic changes to commit."
          else
            git commit -m "chore(traffic): archive daily GitHub Pages traffic metrics [skip ci]"
            git push
          fi
