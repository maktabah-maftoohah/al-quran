name: Deploy Al-Quran to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/traffic/**'
      - '.github/workflows/traffic-archive.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Quran Data
        id: cache-quran-data
        uses: actions/cache@v4
        with:
          path: data/
          key: quran-data-${{ hashFiles('scripts/extract_quran.py') }}
          restore-keys: |
            quran-data-

      - name: Run Quran ETL Pipeline (All 114 Surahs)
        run: |
          python scripts/extract_quran.py --all

      - name: Generate Social Share & Open Graph Verse Pages
        run: |
          python scripts/generate_og_pages.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
