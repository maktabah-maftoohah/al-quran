<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f19">
  <meta name="description" content="Maktabah Maftoohah Al-Quran - Open Quranic Arabic, Multilingual Translations, Word-by-Word Morphology, and Recitations.">
  <title>Al-Quran — Maktabah Maftoohah</title>

  <!-- Google Fonts: Amiri, Scheherazade New, and Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

  <!-- Progressive Web App Manifest & App Icon -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./data/icon.svg">
  <link rel="apple-touch-icon" href="./data/icon.svg">

  <!-- Core Application Stylesheet -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Top Sticky Header -->
  <header class="top-header">
    <div class="brand-section">
      <button class="btn btn-icon" id="toggle-sidebar-btn" aria-label="Toggle navigation drawer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a href="#surah/1" class="brand-title">
        <span>Al-Quran</span>
        <span class="org-badge">maktabah-maftoohah</span>
      </a>
    </div>

    <div class="header-actions">
      <!-- Search Trigger Button -->
      <button class="btn-search-trigger" data-action="open-search" aria-label="Open search engine">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Search Quran...</span>
        <kbd>/</kbd>
      </button>

      <!-- Mushaf Page View Link -->
      <a href="#mushaf/1" class="btn" id="mushaf-mode-btn" title="15-Line Madinah Mushaf Page View" style="text-decoration: none; font-size: 0.8rem; padding: 0.35rem 0.65rem;">
        📄 Mushaf
      </a>

      <!-- Tahfiz / Hifz Memorization Mode Button -->
      <button class="btn" id="hifz-mode-btn" title="Toggle Tahfiz / Hifz Memorization Mode" style="font-size: 0.8rem; padding: 0.35rem 0.65rem;">
        🧠 Hifz
      </button>

      <!-- Typography Settings Button -->
      <button class="btn btn-icon" id="typography-btn" aria-label="Typography settings" title="Text & Display Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 7 4 4 20 4 20 7"></polyline>
          <line x1="9" y1="20" x2="15" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
      </button>

      <!-- Bookmarks Direct Navigation -->
      <a href="#bookmarks" class="btn btn-icon" aria-label="View bookmarks" title="Saved Bookmarks">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
      </a>

      <!-- GitHub Link -->
      <a href="https://github.com/maktabah-maftoohah/al-quran" target="_blank" rel="noopener noreferrer" class="btn btn-icon" title="View Source on GitHub">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
        </svg>
      </a>
    </div>

    <!-- Typography Settings Popover -->
    <div class="popover" id="typography-popover">
      <div style="font-weight: 700; font-size: 0.95rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.5rem;">
        Display & Typography
      </div>

      <!-- Arabic Font Size -->
      <div class="popover-slider-group">
        <div class="slider-label-row">
          <span>Arabic Font Size</span>
          <span id="label-arabic-size">2.1rem</span>
        </div>
        <input type="range" id="slider-arabic-size" min="1.4" max="3.5" step="0.1" value="2.1">
      </div>

      <!-- Translation Font Size -->
      <div class="popover-slider-group">
        <div class="slider-label-row">
          <span>Translation Size</span>
          <span id="label-trans-size">1.02rem</span>
        </div>
        <input type="range" id="slider-trans-size" min="0.8" max="1.5" step="0.05" value="1.02">
      </div>

      <!-- Translations Checkboxes -->
      <div style="display: flex; flex-direction: column; gap: 0.5rem; border-top: 1px solid var(--border-subtle); padding-top: 0.75rem;">
        <span style="font-size: 0.78rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Active Translations</span>
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; cursor: pointer;">
          <input type="checkbox" id="toggle-trans-basmeih" checked>
          <span>🇲🇾 Basmeih (Bahasa Melayu)</span>
        </label>
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; cursor: pointer;">
          <input type="checkbox" id="toggle-trans-sahih" checked>
          <span>🇬🇧 Saheeh International (EN)</span>
        </label>
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; cursor: pointer;">
          <input type="checkbox" id="toggle-trans-pickthall">
          <span>🇬🇧 Pickthall (EN Literary)</span>
        </label>
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; cursor: pointer;">
          <input type="checkbox" id="toggle-trans-kemenag" checked>
          <span>🇮🇩 Kemenag (Bahasa Indonesia)</span>
        </label>
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; cursor: pointer; border-top: 1px dashed var(--border-subtle); padding-top: 0.4rem; margin-top: 0.2rem;">
          <input type="checkbox" id="toggle-jawi-script">
          <span>🇲🇾 Jawi Script (tulisan Jawi)</span>
        </label>
      </div>
    </div>
  </header>

  <!-- App Body Layout -->
  <div class="app-container">

    <!-- Left Sidebar / Navigation Drawer -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-tabs">
        <button class="sidebar-tab active" data-tab="surahs">Surahs (114)</button>
        <button class="sidebar-tab" data-tab="bookmarks">Bookmarks</button>
      </div>

      <!-- Continue Reading Banner -->
      <div class="continue-banner" id="sidebar-continue-banner" style="display: none;"></div>

      <!-- Filter Input -->
      <div class="sidebar-filter-box">
        <input type="text" id="sidebar-search-input" class="sidebar-search-input" placeholder="Filter by number, name, or Arabic...">
      </div>

      <!-- Surah List Container -->
      <nav class="sidebar-list" id="sidebar-surah-list"></nav>

      <!-- Bookmarks List Container -->
      <div class="sidebar-list" id="sidebar-bookmarks-list" style="display: none;"></div>
    </aside>

    <!-- Main Viewport Content Area -->
    <main class="main-content" id="main-viewport" role="main"></main>

  </div>

  <!-- Sticky Bottom Audio Player -->
  <footer class="sticky-audio-player" id="sticky-audio-player">
    <div class="player-info">
      <span class="player-ayah-badge" id="player-ayah-badge">1:1</span>
      <div class="player-titles">
        <span class="player-title-surah" id="player-surah-title">Al-Faatiha</span>
        <span class="player-title-reciter" id="player-reciter-title">Mishary Rashid Alafasy</span>
      </div>
    </div>

    <div class="player-center-controls">
      <button class="btn btn-icon" id="player-prev-btn" title="Previous Ayah (Alt + ←)" aria-label="Previous Ayah">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
        </svg>
      </button>

      <button class="player-btn-main" id="player-play-pause-btn" title="Play / Pause (Space)" aria-label="Play or Pause">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <button class="btn btn-icon" id="player-next-btn" title="Next Ayah (Alt + →)" aria-label="Next Ayah">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>
    </div>

    <div class="player-right-options">
      <!-- Reciter Select -->
      <select class="reciter-select" id="player-reciter-select" title="Change Reciter">
        <option value="Alafasy_128kbps">Alafasy (128k)</option>
        <option value="Husary_128kbps">Al-Husary (128k)</option>
        <option value="Abdul_Basit_Murattal_192kbps">Abdul Basit (192k)</option>
      </select>

      <!-- Loop Ayah Toggle -->
      <div class="player-option-toggle" id="player-loop-toggle" title="Toggle repeat current verse">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"></polyline>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <polyline points="7 23 3 19 7 15"></polyline>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
        <span>Loop</span>
      </div>

      <!-- Auto Scroll Toggle -->
      <div class="player-option-toggle active" id="player-autoscroll-toggle" title="Toggle auto-scroll to active verse">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="19 12 12 19 5 12"></polyline>
        </svg>
        <span>Scroll</span>
      </div>
    </div>
  </footer>

  <!-- Search Modal Overlay -->
  <div class="modal-overlay" id="search-modal-overlay">
    <div class="search-modal">
      <div class="search-header-input">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input-field" class="search-input-field" placeholder="Search surah, verse jump (112:1), or keywords..." autocomplete="off">
        <button class="btn btn-icon" data-action="close-search" aria-label="Close search">✕</button>
      </div>
      <div class="search-results-list" id="search-results-list"></div>
    </div>
  </div>

  <!-- Shareable Verse Card Modal Overlay -->
  <div class="modal-overlay" id="verse-card-modal">
    <div class="verse-card-modal-content">
      <div class="drawer-header">
        <div style="font-weight: 700; font-size: 1rem; color: var(--text-primary); display: flex; align-items: center; gap: 0.5rem;">
          <span>📸 Shareable Verse Card</span>
        </div>
        <button class="btn btn-icon" data-action="close-card-modal" aria-label="Close modal">✕</button>
      </div>
      <div style="padding: 1.25rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; overflow-y: auto;">
        <canvas id="verse-card-canvas" class="verse-card-canvas-preview"></canvas>
        
        <div style="display: flex; gap: 0.75rem; width: 100%; align-items: center; justify-content: space-between; flex-wrap: wrap;">
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">Format:</label>
            <select id="card-ratio-select" class="select-input">
              <option value="1:1" selected>Square (1:1 Feed / Status)</option>
              <option value="9:16">Story (9:16 Portrait)</option>
            </select>
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-primary" id="btn-download-card">💾 Download PNG</button>
            <button class="btn" id="btn-copy-card-image">📋 Copy</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Morphology & Root Concordance Drawer -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="morphology-drawer" id="morphology-drawer" aria-label="Word Morphology and Root Concordance Drawer">
    <div class="drawer-header">
      <div style="font-weight: 700; font-size: 1rem; color: var(--text-primary);">Word Morphology & Root</div>
      <button class="btn btn-icon" id="close-morph-drawer-btn" aria-label="Close drawer">✕</button>
    </div>
    <div class="drawer-body" id="morph-drawer-body"></div>
  </aside>

  <!-- Global Application Module Entry Point -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
