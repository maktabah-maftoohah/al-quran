<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Quran — Maktabah Maftoohah</title>
  <script>
    (function() {
      var pathname = window.location.pathname; // e.g. /al-quran/69/47 or /69/47
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // Determine base path (supports subpath hosting on GitHub Pages and root domain)
      var repoBase = '/';
      var subPath = pathname;
      if (pathname.indexOf('/al-quran') === 0) {
        repoBase = '/al-quran/';
        subPath = pathname.slice('/al-quran'.length);
      }
      subPath = subPath.replace(/^\/+|\/+$/g, ''); // strip leading/trailing slashes

      var targetHash = '';

      if (subPath) {
        // 1. Direct Verse Path: {surah}/{ayah} or {surah}:{ayah} (e.g. 69/47, 69:47, 2/255, al-haqqah/47)
        var ayahMatch = subPath.match(/^([^/:]+)[/:](\d+)$/);
        if (ayahMatch) {
          targetHash = '#' + ayahMatch[1] + ':' + ayahMatch[2];
        } else {
          // 2. Single Ayah Deep-Dive Path: ayah/{surah}/{ayah}
          var deepMatch = subPath.match(/^ayah\/([^/:]+)[/:-](\d+)$/);
          if (deepMatch) {
            targetHash = '#ayah/' + deepMatch[1] + '/' + deepMatch[2];
          } else {
            // 3. Surah Chapter Path: surah/{surah} or {surah} (e.g. 69, al-haqqah, surah/69)
            var surahMatch = subPath.match(/^(?:surah\/)?([^/:]+)$/);
            if (surahMatch && surahMatch[1] !== '404' && surahMatch[1] !== 'index.html') {
              targetHash = '#surah/' + surahMatch[1];
            } else if (hash) {
              targetHash = hash;
            }
          }
        }
      } else if (hash) {
        targetHash = hash;
      }

      var destination = repoBase + (targetHash || '');
      if (search && destination.indexOf('?') === -1) {
        destination += search;
      }

      window.location.replace(destination);
    })();
  </script>
</head>
<body style="background: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
  <div style="text-align: center; padding: 2rem;">
    <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">📖</div>
    <div style="font-size: 1.15rem; font-weight: 600; color: #10b981; margin-bottom: 0.5rem;">Maktabah Maftoohah Al-Quran</div>
    <div style="font-size: 0.9rem; color: #94a3b8;">Menuju ke ayat yang diminta... / Navigating to requested verse...</div>
  </div>
</body>
</html>
